apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: upi-forecaster-ingress
  namespace: project
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  rules:
  - host: 127.0.0.1.nip.io
    http:
      paths:
      - path: /forecast
        pathType: Prefix
        backend:
          service:
            name: upi-forecaster-service
            port:
              number: 8000
      - path: /docs
        pathType: Prefix
        backend:
          service:
            name: upi-forecaster-service
            port:
              number: 8000
      - path: /openapi.json
        pathType: Prefix
        backend:
          service:
            name: upi-forecaster-service
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: upi-forecaster-service
            port:
              number: 8501